<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>RMSLogis | Configuracoes</title>
</head>
<body data-page="configuracoes">
    <aside class="sidebar">
        <a class="logo" href="dashboard.html">RMSLogis</a>
        <nav class="menu" aria-label="Menu principal"></nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <h1>Configuracoes</h1>
                <p>Preferencias da operacao</p>
            </div>
            <div class="usuario" data-user>Operador</div>
        </header>

        <section class="form-panel">
            <h2>Dados padrao</h2>
            <form class="form-grid" data-form="settings">
                <label>Nome da empresa<input name="empresa" type="text" required></label>
                <label>Operador padrao<input name="operador" type="text" required></label>
                <label>Valor unitario por pacote - Moto<input name="valorMoto" type="number" min="0" step="0.01" required></label>
                <label>Valor unitario por pacote - Carro<input name="valorCarro" type="number" min="0" step="0.01" required></label>
                <label>Valor unitario por pacote - Van<input name="valorVan" type="number" min="0" step="0.01" required></label>
                <label>Empresas para as rotas<textarea name="empresas" rows="4" placeholder="Uma empresa por linha" required></textarea></label>
                <button class="btn btn-primary" type="submit">Salvar configuracoes</button>
            </form>
            <p class="form-help">Usuarios e permissoes sao gerenciados no Supabase Authentication.</p>
        </section>

        <section class="danger-zone">
            <div>
                <h2>Banco de dados</h2>
                <p>Esta acao remove os registros operacionais do projeto Supabase.</p>
            </div>
            <button class="btn btn-danger" data-reset-system type="button">Limpar dados</button>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="app.js"></script>
</body>
</html>
