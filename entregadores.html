<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>RMSLogis | Entregadores</title>
</head>
<body data-page="entregadores">
    <aside class="sidebar">
        <a class="logo" href="dashboard.html">RMSLogis</a>
        <nav class="menu" aria-label="Menu principal"></nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <h1>Entregadores</h1>
                <p>Cadastro e controle da equipe</p>
            </div>
            <div class="usuario" data-user>Operador</div>
        </header>

        <section class="form-panel">
            <h2 data-driver-form-title>Novo entregador</h2>
            <form class="form-grid" data-form="driver">
                <input name="driverId" type="hidden">
                <label>Nome<input name="nome" type="text" placeholder="Nome completo" required></label>
                <label>CPF<input name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" required></label>
                <label>CNH<input name="cnh" type="text" placeholder="Numero da CNH" required></label>
                <label>Telefone<input name="telefone" type="tel" placeholder="(00) 00000-0000" required></label>
                <label>E-mail<input name="email" type="email" placeholder="entregador@email.com" required></label>
                <label>Endereco<input name="endereco" type="text" placeholder="Rua, numero, bairro e cidade" required></label>
                <label>Veiculo
                    <select name="veiculo" required>
                        <option value="Moto">Moto</option>
                        <option value="Carro">Carro</option>
                        <option value="Van">Van</option>
                    </select>
                </label>
                <label>Status
                    <select name="status">
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>
                </label>
                <label>Tipo de chave Pix
                    <select name="pixTipo">
                        <option value="">Sem chave Pix</option>
                        <option value="cpf">CPF</option>
                        <option value="cnpj">CNPJ</option>
                        <option value="email">E-mail</option>
                        <option value="telefone">Telefone</option>
                        <option value="aleatoria">Aleatoria</option>
                    </select>
                </label>
                <label>Chave Pix<input name="pixChave" type="text" placeholder="Informe a chave Pix" autocomplete="off"></label>
                <label>Identidade (PDF, JPG ou PNG)<input name="arquivoIdentidade" type="file" accept="image/jpeg,image/png,application/pdf"><span class="form-help" data-doc-status="identidade"></span></label>
                <label>Comprovante de residência (PDF, JPG ou PNG)<input name="arquivoResidencia" type="file" accept="image/jpeg,image/png,application/pdf"><span class="form-help" data-doc-status="residencia"></span></label>
                <button class="btn btn-primary" data-driver-submit type="submit">Cadastrar</button>
                <button class="btn btn-muted" data-driver-cancel hidden type="button">Cancelar edicao</button>
            </form>
        </section>

        <section class="tabela-container">
            <div class="section-title">
                <h2>Lista de entregadores</h2>
                <span data-driver-count>0 cadastrados</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th data-admin-only>CPF</th>
                        <th>Telefone</th>
                        <th data-admin-only>E-mail</th>
                        <th>Veiculo</th>
                        <th data-admin-only>Chave Pix</th>
                        <th>Status</th>
                        <th data-admin-only>Documentos</th>
                        <th data-admin-only>Acoes</th>
                    </tr>
                </thead>
                <tbody data-drivers-table></tbody>
            </table>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="app.js"></script>
</body>
</html>
